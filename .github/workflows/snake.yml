name: Generate Snake Animation

on:
  # Regenerate every day at 00:00 UTC (05:30 IST)
  schedule:
    - cron: "0 0 * * *"
  # Allow running manually from the Actions tab
  workflow_dispatch:
  # Also refresh whenever main is updated
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gen
        with:
          github_user_name: ${{ github.repository_owner }}
          # Uses the automatic GITHUB_TOKEN — no personal token required here
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake-ocean.gif?color_snake=orange&color_dots=#bfd0d0,#71b7ff,#3767ff,#0037bf,#001d80

      - name: Push snake SVGs to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
